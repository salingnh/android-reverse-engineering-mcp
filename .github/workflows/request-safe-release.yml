name: Request Safe Android Reverser release

on:
  push:
    branches:
      - 'release-request/safe-v*'

permissions:
  actions: write
  contents: read

concurrency:
  group: safe-android-reverser-release-request-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch canonical release orchestrator
    runs-on: ubuntu-latest
    steps:
      - name: Normalize release request branch
        id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prefix='release-request/safe-v'
          [[ "$REF_NAME" == "$prefix"* ]] || {
            echo "::error::release request branch must match release-request/safe-vX.Y.Z"
            exit 1
          }
          version="${REF_NAME#${prefix}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release request branch must match release-request/safe-vX.Y.Z"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch Ship Safe Android Reverser
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run ship-safe-reverser.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f "version=${VERSION}"
