name: Build framework-flutter capability

on:
  pull_request:
    paths:
      - 'frameworks/flutter/**'
      - 'program_model.py'
      - 'application_map.py'
      - 'context_retrieval.py'
      - 'ownership_contract.py'
      - 'tests_program_model_contract.py'
      - 'tests_application_map.py'
      - 'tests_context_retrieval.py'
      - 'sandbox/peg_schema.py'
      - 'docs/PROGRAM_MODEL.md'
      - 'docs/APPLICATION_MAP.md'
      - 'docs/APPLICATION_MAP_ROUTING.md'
      - 'docs/CONTEXT_RETRIEVAL.md'
      - 'plugins/safe-android-reverser/VERSION'
      - 'plugins/safe-android-reverser/capabilities/framework-flutter.json'
      - 'scripts/check_release_consistency.py'
      - '.github/workflows/build-flutter-profile.yml'
  push:
    branches: [master, 'feat/**']
    tags: ['safe-v*']
    paths:
      - 'frameworks/flutter/**'
      - 'program_model.py'
      - 'application_map.py'
      - 'context_retrieval.py'
      - 'ownership_contract.py'
      - 'tests_program_model_contract.py'
      - 'tests_application_map.py'
      - 'tests_context_retrieval.py'
      - 'sandbox/peg_schema.py'
      - 'docs/PROGRAM_MODEL.md'
      - 'docs/APPLICATION_MAP.md'
      - 'docs/APPLICATION_MAP_ROUTING.md'
      - 'docs/CONTEXT_RETRIEVAL.md'
      - 'plugins/safe-android-reverser/VERSION'
      - 'plugins/safe-android-reverser/capabilities/framework-flutter.json'
      - 'scripts/check_release_consistency.py'
      - '.github/workflows/build-flutter-profile.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read pinned versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source frameworks/flutter/tools.lock.env
          version="$(tr -d '[:space:]' < plugins/safe-android-reverser/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "blutter_repository=$BLUTTER_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "blutter_commit=$BLUTTER_COMMIT" >> "$GITHUB_OUTPUT"
          test "$BLUTTER_LICENSE" = "MIT"
          [[ "$BLUTTER_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check release and capability consistency
        run: python3 scripts/check_release_consistency.py

      - name: Test Canonical Program Model contract
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 tests_program_model_contract.py

      - name: Test Application Map projection contract
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 tests_application_map.py

      - name: Test Context Retrieval contract
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 tests_context_retrieval.py

      - name: Test Flutter Program Model provider
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 frameworks/flutter/tests_flutter_program_model.py

      - name: Test Flutter Application Map provider integration
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 frameworks/flutter/tests_application_map.py

      - name: Test Flutter Context Retrieval provider integration
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 frameworks/flutter/tests_context_retrieval.py

      - name: Test offline-safe Blutter adapter
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 frameworks/flutter/tests_safe_blutter_adapter.py

      - name: Test Flutter semantic index
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 frameworks/flutter/tests_flutter_semantic.py

      - name: Test Flutter network model
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 frameworks/flutter/tests_flutter_network.py

      - name: Test Flutter worker orchestration primitives
        run: PYTHONPATH=.:frameworks/flutter:sandbox python3 frameworks/flutter/tests_flutter_orchestration.py

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            ownership_contract.py \
            program_model.py \
            application_map.py \
            context_retrieval.py \
            tests_program_model_contract.py \
            tests_application_map.py \
            tests_context_retrieval.py \
            sandbox/peg_schema.py \
            frameworks/flutter/cache_identity.py \
            frameworks/flutter/build_runtime.py \
            frameworks/flutter/safe_blutter_adapter.py \
            frameworks/flutter/flutter_semantic.py \
            frameworks/flutter/flutter_program_model.py \
            frameworks/flutter/flutter_context_retrieval.py \
            frameworks/flutter/flutter_network.py \
            frameworks/flutter/flutter_artifact.py \
            frameworks/flutter/flutter_export.py \
            frameworks/flutter/flutter_entrypoint.py \
            frameworks/flutter/tests_safe_blutter_adapter.py \
            frameworks/flutter/tests_flutter_semantic.py \
            frameworks/flutter/tests_flutter_program_model.py \
            frameworks/flutter/tests_application_map.py \
            frameworks/flutter/tests_context_retrieval.py \
            frameworks/flutter/tests_flutter_network.py \
            frameworks/flutter/tests_flutter_orchestration.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build framework-flutter worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frameworks/flutter/Dockerfile
          load: true
          push: false
          tags: safe-android-reverser-flutter:ci
          build-args: |
            SAFE_REVERSER_VERSION=${{ steps.versions.outputs.version }}
            SAFE_REVERSER_BUILD_COMMIT=${{ github.sha }}
            BLUTTER_REPOSITORY=${{ steps.versions.outputs.blutter_repository }}
            BLUTTER_COMMIT=${{ steps.versions.outputs.blutter_commit }}
          cache-from: type=gha,scope=flutter-profile
          cache-to: type=gha,mode=max,scope=flutter-profile

      - name: Verify capability ABI labels
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.versions.outputs.blutter_commit }}
        run: |
          python3 - "$VERSION" "$EXPECTED_COMMIT" <<'PY'
          import json
          import subprocess
          import sys
          info = json.loads(subprocess.check_output(['docker', 'image', 'inspect', 'safe-android-reverser-flutter:ci']))[0]
          labels = info['Config']['Labels']
          assert labels['org.opencontainers.image.version'] == sys.argv[1], labels
          assert labels['io.safe-reverser.capability.id'] == 'framework-flutter', labels
          assert labels['io.safe-reverser.capability.api'] == '1', labels
          assert labels['io.safe-reverser.worker.abi'] == '1', labels
          assert labels['io.safe-reverser.blutter.commit'] == sys.argv[2], labels
          PY

      - name: Verify Program Model, Application Map and Context Retrieval package inside locked image
        run: |
          docker run --rm \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=256m \
            --tmpfs=/work:rw,nosuid,nodev,size=256m \
            --entrypoint=python3 \
            safe-android-reverser-flutter:ci \
            -c 'import application_map as amap, context_retrieval as ctx, flutter_context_retrieval as fctx, program_model as pm, flutter_program_model as fp, peg_schema as peg; assert pm.descriptor()["program_model_version"] == 1; assert pm.descriptor()["provider_continuation"] is True; assert amap.descriptor()["application_map_version"] == 1; assert amap.descriptor()["projection_only"] is True; assert amap.descriptor()["persistent_map_storage"] is False; assert ctx.descriptor()["context_retrieval_version"] == 1; assert ctx.descriptor()["progressive_semantic_retrieval"] is True; assert ctx.descriptor()["persistent_context_storage"] is False; assert ctx.descriptor()["calls_xref_are_data_flow"] is False; assert fctx.FlutterContextSourceProvider is not None; assert fp.FlutterProgramProvider is not None; assert peg.PEG_SCHEMA_VERSION == 2'

      - name: Verify locked offline runtime and semantic surface
        env:
          EXPECTED_COMMIT: ${{ steps.versions.outputs.blutter_commit }}
        run: |
          output="$(docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=256m \
            --tmpfs=/work:rw,nosuid,nodev,size=256m \
            safe-android-reverser-flutter:ci health)"
          python3 - "$output" "$EXPECTED_COMMIT" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          assert payload['status'] == 'ok', payload
          assert payload['profile'] == 'framework-flutter', payload
          assert payload['blutter_commit'] == sys.argv[2], payload
          assert payload['network_required_at_runtime'] is False, payload
          assert payload['network_capable_upstream_path_used'] is False, payload
          assert payload['build_on_demand_allowed'] is False, payload
          assert payload['registry_selection_owned_by_worker'] is False, payload
          constraints = payload['required_runtime_constraints']
          assert constraints['network'] == 'none', payload
          assert constraints['output_mount'] == 'writable-bounded', payload
          semantic = payload['semantic_index']
          assert semantic['available'] is True, payload
          assert semantic['storage'] == 'sqlite', payload
          assert semantic['schema_version'] == 1, payload
          assert semantic['network_model_max_items'] == 200, payload
          expected = {
              'build_flutter_index', 'find_dart_symbols', 'find_dart_strings',
              'find_dart_xrefs', 'map_dart_to_native', 'extract_flutter_network_model',
              'get_application_map', 'expand_application_node', 'get_function_context',
          }
          assert expected == set(semantic['operations']), payload
          assert payload['application_map']['application_map_version'] == 1, payload
          assert payload['application_map']['projection_only'] is True, payload
          assert payload['application_map']['persistent_map_storage'] is False, payload
          assert payload['context_retrieval']['context_retrieval_version'] == 1, payload
          assert payload['context_retrieval']['progressive_semantic_retrieval'] is True, payload
          assert payload['context_retrieval']['persistent_context_storage'] is False, payload
          assert payload['context_retrieval']['calls_xref_are_data_flow'] is False, payload
          orchestration = payload['orchestration']
          assert orchestration['prepare_artifact'] is True, payload
          assert orchestration['analyze_export'] is True, payload
          assert orchestration['supported_abi'] == 'arm64-v8a', payload
          assert orchestration['persistent_export_max_bytes'] == 4 * 1024**3, payload
          assert orchestration['persistent_export_max_files'] == 20_000, payload
          assert orchestration['runtime_download_inside_sandbox'] is False, payload
          assert orchestration['runtime_build_inside_sandbox'] is False, payload
          PY

      - name: Verify pinned upstream license is preserved
        run: |
          docker run --rm -i \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --entrypoint=python3 \
            safe-android-reverser-flutter:ci - <<'PY'
          from pathlib import Path
          text = Path('/opt/blutter/LICENSE').read_text(encoding='utf-8')
          assert 'MIT License' in text
          PY

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/safe-v'))
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read pinned versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source frameworks/flutter/tools.lock.env
          version="$(tr -d '[:space:]' < plugins/safe-android-reverser/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "blutter_repository=$BLUTTER_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "blutter_commit=$BLUTTER_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing semver image
        if: startsWith(github.ref, 'refs/tags/safe-v')
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/safe-android-reverser-flutter:$VERSION"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::release image already exists and is immutable: $image"
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/safe-android-reverser-flutter
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=safe-v(.*),group=1

      - name: Publish framework-flutter worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frameworks/flutter/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SAFE_REVERSER_VERSION=${{ steps.versions.outputs.version }}
            SAFE_REVERSER_BUILD_COMMIT=${{ github.sha }}
            BLUTTER_REPOSITORY=${{ steps.versions.outputs.blutter_repository }}
            BLUTTER_COMMIT=${{ steps.versions.outputs.blutter_commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=flutter-profile
          cache-to: type=gha,mode=max,scope=flutter-profile
