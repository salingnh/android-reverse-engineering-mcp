name: Build safe reverser sandbox

on:
  pull_request:
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/**'
      - 'scripts/check_release_consistency.py'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/build-safe-sandbox.yml'
  push:
    branches:
      - master
      - 'feat/**'
    tags: ['safe-v*']
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/**'
      - 'scripts/check_release_consistency.py'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/build-safe-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < plugins/safe-android-reverser/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release consistency
        run: python3 scripts/check_release_consistency.py

      - name: Test MCP server
        run: python3 sandbox/tests.py

      - name: Test framework-aware analyzer routing
        run: PYTHONPATH=sandbox python3 sandbox/tests_analysis_routing.py

      - name: Test Program Evidence Graph schema
        run: PYTHONPATH=sandbox python3 sandbox/tests_peg_schema.py

      - name: Test Flutter artifact/runtime inspection
        run: PYTHONPATH=sandbox python3 sandbox/tests_flutter_analysis.py

      - name: Test program understanding
        run: python3 sandbox/tests_program_understanding.py

      - name: Test program understanding source scopes and cache integrity
        run: PYTHONPATH=sandbox python3 sandbox/tests_program_understanding_scopes.py

      - name: Test Flutter host MCP controller
        run: python3 plugins/safe-android-reverser/bin/tests_flutter_mcp_host.py

      - name: Test extended MCP registration and release metadata
        env:
          SAFE_REVERSER_IMAGE_VERSION: ${{ steps.version.outputs.version }}
          SAFE_REVERSER_PLUGIN_VERSION: ${{ steps.version.outputs.version }}
          SAFE_REVERSER_BUILD_COMMIT: ${{ github.sha }}
        run: |
          export SAFE_REVERSER_WORKSPACE="$RUNNER_TEMP/safe-reverser-workspace"
          export SAFE_REVERSER_DATA_ROOT="$RUNNER_TEMP/safe-reverser-data"
          mkdir -p "$SAFE_REVERSER_WORKSPACE" "$SAFE_REVERSER_DATA_ROOT"
          PYTHONPATH=sandbox python3 - <<'PY'
          import mcp_entrypoint as entry
          server = entry.server
          names = {tool["name"] for tool in server.core.TOOLS}
          expected = {
              "route_analysis",
              "inspect_flutter",
              "identify_dart_runtime",
              "extract_flutter_assets",
              "build_program_index",
              "find_symbols",
              "find_xrefs",
              "get_cfg",
              "identify_protector",
              "extract_network_model",
          }
          missing = expected - names
          assert not missing, f"missing semantic MCP tools: {sorted(missing)}"
          health = entry.health({})
          assert health["version"] == entry.RELEASE_VERSION, health
          assert health["release"]["server_version"] == entry.RELEASE_VERSION, health
          assert health["release"]["plugin_version"] == entry.RELEASE_VERSION, health
          assert health["release"]["image_version"] == entry.RELEASE_VERSION, health
          assert health["release"]["version_consistent"] is True, health
          assert health["program_understanding"]["program_index"] is True
          assert health["program_understanding"]["index_storage"] == "sqlite"
          assert health["analysis_routing"]["enabled"] is True
          assert health["analysis_routing"]["profiles"]["static-core"]["status"] == "available"
          flutter_profile = health["analysis_routing"]["profiles"]["framework-flutter"]
          assert flutter_profile["status"] == "available", health
          assert flutter_profile["capability_server"] == "safe-android-reverser-flutter", health
          assert "dart-aot-index" in flutter_profile["available_capabilities"], health
          assert health["program_evidence_graph"]["schema_version"] == 2
          assert health["program_evidence_graph"]["status"] == "foundation"
          flutter = health["framework_analysis"]["flutter"]
          assert flutter["artifact_inspection"] is True
          assert flutter["dart_aot_index"] is True
          assert flutter["dart_xrefs"] is True
          assert flutter["dart_to_native_map"] is True
          assert flutter["network_model"] is True
          assert flutter["capability_server"] == "safe-android-reverser-flutter"
          assert flutter["runtime_socket_mounted_into_static_sandbox"] is False
          PY

      - name: Test automatic runtime wrapper
        run: bash sandbox/test_wrapper.sh

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            sandbox/mcp_server.py \
            sandbox/mcp_server_v2.py \
            sandbox/mcp_entrypoint.py \
            sandbox/analysis_routing.py \
            sandbox/peg_schema.py \
            sandbox/flutter_analysis.py \
            sandbox/program_understanding.py \
            sandbox/program_understanding_v2.py \
            sandbox/pu_source.py \
            sandbox/pu_index.py \
            sandbox/pu_network.py \
            sandbox/tests_analysis_routing.py \
            sandbox/tests_peg_schema.py \
            sandbox/tests_flutter_analysis.py \
            sandbox/tests_program_understanding.py \
            sandbox/tests_program_understanding_scopes.py \
            plugins/safe-android-reverser/bin/flutter-mcp-host.py \
            plugins/safe-android-reverser/bin/tests_flutter_mcp_host.py \
            scripts/check_release_consistency.py

      - name: Validate shell wrapper syntax
        run: |
          bash -n plugins/safe-android-reverser/bin/safe-reverser-mcp
          bash -n plugins/safe-android-reverser/bin/safe-flutter-mcp

      - name: Validate JSON manifests
        run: |
          python3 -m json.tool plugins/safe-android-reverser/.claude-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/safe-android-reverser/.mcp.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 - <<'PY'
          import json
          manifest = json.load(open('plugins/safe-android-reverser/.mcp.json', encoding='utf-8'))
          servers = manifest['mcpServers']
          assert set(servers) == {'safe-android-reverser', 'safe-android-reverser-flutter'}
          flutter = servers['safe-android-reverser-flutter']
          assert flutter['command'] == 'bash'
          assert flutter['args'] == ['${CLAUDE_PLUGIN_ROOT}/bin/safe-flutter-mcp']
          PY

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < plugins/safe-android-reverser/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image for integration tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          load: true
          push: false
          tags: safe-android-reverser:ci
          build-args: |
            SAFE_REVERSER_VERSION=${{ steps.version.outputs.version }}
            SAFE_REVERSER_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run framework routing integration test inside image
        run: |
          mkdir -p "$RUNNER_TEMP/safe-reverser-routing-data"
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
            --tmpfs=/work:rw,nosuid,nodev,size=1g \
            --user="$(id -u):$(id -g)" \
            --volume="$PWD:/workspace:ro" \
            --volume="$RUNNER_TEMP/safe-reverser-routing-data:/data:rw" \
            --entrypoint=python3 \
            safe-android-reverser:ci \
            /workspace/sandbox/tests_analysis_routing.py

      - name: Run Flutter inspector integration test inside image
        run: |
          mkdir -p "$RUNNER_TEMP/safe-reverser-flutter-data"
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
            --tmpfs=/work:rw,nosuid,nodev,size=1g \
            --user="$(id -u):$(id -g)" \
            --volume="$PWD:/workspace:ro" \
            --volume="$RUNNER_TEMP/safe-reverser-flutter-data:/data:rw" \
            --entrypoint=python3 \
            safe-android-reverser:ci \
            /workspace/sandbox/tests_flutter_analysis.py

      - name: Run real DEX semantic integration test inside image
        run: |
          mkdir -p "$RUNNER_TEMP/safe-reverser-runtime-data"
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
            --tmpfs=/work:rw,nosuid,nodev,size=1g \
            --user="$(id -u):$(id -g)" \
            --volume="$PWD:/workspace:ro" \
            --volume="$RUNNER_TEMP/safe-reverser-runtime-data:/data:rw" \
            --entrypoint=python3 \
            safe-android-reverser:ci \
            /workspace/sandbox/tests_program_understanding.py

      - name: Run source-scope/cache regression test inside image
        run: |
          mkdir -p "$RUNNER_TEMP/safe-reverser-scope-data"
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
            --tmpfs=/work:rw,nosuid,nodev,size=1g \
            --user="$(id -u):$(id -g)" \
            --volume="$PWD:/workspace:ro" \
            --volume="$RUNNER_TEMP/safe-reverser-scope-data:/data:rw" \
            --entrypoint=python3 \
            safe-android-reverser:ci \
            /workspace/sandbox/tests_program_understanding_scopes.py

      - name: Run MCP health smoke test inside image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/safe-reverser-mcp-data"
          output="$RUNNER_TEMP/safe-reverser-health.jsonl"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"health","arguments":{}}}' \
          | docker run --rm -i \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
              --tmpfs=/work:rw,nosuid,nodev,size=1g \
              --user="$(id -u):$(id -g)" \
              --env="SAFE_REVERSER_PLUGIN_VERSION=$VERSION" \
              --env="SAFE_REVERSER_IMAGE_REF=safe-android-reverser:ci" \
              --env="SAFE_REVERSER_IMAGE_ID=ci-test" \
              --volume="$PWD:/workspace:ro" \
              --volume="$RUNNER_TEMP/safe-reverser-mcp-data:/data:rw" \
              safe-android-reverser:ci > "$output"
          python3 - "$output" "$VERSION" <<'PY'
          import json
          import sys
          responses = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          expected_version = sys.argv[2]
          health_response = next(item for item in responses if item.get("id") == 2)
          payload = json.loads(health_response["result"]["content"][0]["text"])
          assert payload["version"] == expected_version, payload
          assert payload["release"]["server_version"] == expected_version, payload
          assert payload["release"]["plugin_version"] == expected_version, payload
          assert payload["release"]["image_version"] == expected_version, payload
          assert payload["release"]["version_consistent"] is True, payload
          assert payload["release"]["build_commit"] == "${{ github.sha }}", payload
          assert payload["tools"]["androguard"] is True, payload
          assert payload["program_understanding"]["cfg"] is True, payload
          assert payload["program_understanding"]["index_storage"] == "sqlite", payload
          assert payload["analysis_routing"]["enabled"] is True, payload
          flutter_profile = payload["analysis_routing"]["profiles"]["framework-flutter"]
          assert flutter_profile["status"] == "available", payload
          assert flutter_profile["capability_server"] == "safe-android-reverser-flutter", payload
          assert payload["program_evidence_graph"]["schema_version"] == 2, payload
          flutter = payload["framework_analysis"]["flutter"]
          assert flutter["artifact_inspection"] is True, payload
          assert flutter["dart_aot_index"] is True, payload
          assert flutter["capability_server"] == "safe-android-reverser-flutter", payload
          assert flutter["runtime_socket_mounted_into_static_sandbox"] is False, payload
          PY

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/safe-v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing semver image
        if: startsWith(github.ref, 'refs/tags/safe-v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/safe-android-reverser:$VERSION"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::release image already exists and is immutable: $image"
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/safe-android-reverser
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=safe-v(.*),group=1

      - name: Publish tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/safe-v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SAFE_REVERSER_VERSION=${{ steps.version.outputs.version }}
            SAFE_REVERSER_BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
