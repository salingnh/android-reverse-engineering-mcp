name: Build static-core capability

on:
  pull_request:
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/VERSION'
      - 'plugins/safe-android-reverser/tool-catalogs/static-core.json'
      - 'plugins/safe-android-reverser/capabilities/static-core.json'
      - 'scripts/check_release_consistency.py'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/build-safe-sandbox.yml'
  push:
    branches: [master, 'feat/**']
    tags: ['safe-v*']
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/VERSION'
      - 'plugins/safe-android-reverser/tool-catalogs/static-core.json'
      - 'plugins/safe-android-reverser/capabilities/static-core.json'
      - 'scripts/check_release_consistency.py'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/build-safe-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < plugins/safe-android-reverser/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release consistency
        run: python3 scripts/check_release_consistency.py

      - name: Test MCP worker
        run: python3 sandbox/tests.py

      - name: Test framework-aware routing topology
        run: PYTHONPATH=sandbox python3 sandbox/tests_analysis_routing.py

      - name: Test archive safety budgets
        run: PYTHONPATH=sandbox python3 sandbox/tests_archive_safety.py

      - name: Test Program Evidence Graph schema
        run: PYTHONPATH=sandbox python3 sandbox/tests_peg_schema.py

      - name: Test bounded Flutter artifact inspection
        run: PYTHONPATH=sandbox python3 sandbox/tests_flutter_analysis.py

      - name: Test program understanding
        run: python3 sandbox/tests_program_understanding.py

      - name: Test program understanding source scopes and cache integrity
        run: PYTHONPATH=sandbox python3 sandbox/tests_program_understanding_scopes.py

      - name: Test static worker registration and release metadata
        env:
          SAFE_REVERSER_IMAGE_VERSION: ${{ steps.version.outputs.version }}
          SAFE_REVERSER_PLUGIN_VERSION: ${{ steps.version.outputs.version }}
          SAFE_REVERSER_BUILD_COMMIT: ${{ github.sha }}
        run: |
          export SAFE_REVERSER_WORKSPACE="$RUNNER_TEMP/safe-reverser-workspace"
          export SAFE_REVERSER_DATA_ROOT="$RUNNER_TEMP/safe-reverser-data"
          mkdir -p "$SAFE_REVERSER_WORKSPACE" "$SAFE_REVERSER_DATA_ROOT"
          PYTHONPATH=sandbox python3 - <<'PY'
          import json
          from pathlib import Path
          import mcp_entrypoint as entry

          server = entry.server
          canonical = json.loads(
              Path('plugins/safe-android-reverser/tool-catalogs/static-core.json').read_text(
                  encoding='utf-8'
              )
          )
          public = [tool for tool in server.core.TOOLS if tool.get('name') != 'health']
          assert public == canonical, 'worker descriptors must be the canonical host catalog verbatim'
          assert {tool['name'] for tool in public} == set(server.core.TOOL_HANDLERS) - {'health'}
          assert [tool.get('name') for tool in server.core.TOOLS].count('health') == 1

          health = entry.health({})
          assert health['version'] == entry.RELEASE_VERSION, health
          assert health['release']['server_version'] == entry.RELEASE_VERSION, health
          assert health['release']['plugin_version'] == entry.RELEASE_VERSION, health
          assert health['release']['image_version'] == entry.RELEASE_VERSION, health
          assert health['release']['version_consistent'] is True, health
          assert health['capability_worker'] == {
              'id': 'static-core',
              'capability_api': 1,
              'worker_abi': 1,
              'runtime_readiness_authority': 'host-control-plane',
          }, health
          assert health['analysis_routing']['schema_version'] == 2, health
          assert health['analysis_routing']['profiles']['static-core']['status'] == 'available', health
          assert health['analysis_routing']['profiles']['framework-flutter']['status'] == 'declared', health
          assert health['program_evidence_graph']['schema_version'] == 2, health
          assert health['framework_analysis']['flutter']['artifact_inspection'] is True, health
          assert health['framework_analysis']['flutter']['dart_aot_index'] is False, health
          assert health['tool_contract']['source'] == 'static-core.json', health
          assert health['tool_contract']['single_descriptor_source'] is True, health
          assert health['tool_contract']['public_operation_count'] == len(canonical), health
          PY

      - name: Validate static-worker Python syntax
        run: |
          python3 -m py_compile \
            sandbox/mcp_server.py \
            sandbox/static_semantic_worker.py \
            sandbox/mcp_entrypoint.py \
            sandbox/analysis_routing.py \
            sandbox/archive_safety.py \
            sandbox/peg_schema.py \
            sandbox/flutter_analysis.py \
            sandbox/program_understanding.py \
            sandbox/program_understanding_v2.py \
            sandbox/pu_source.py \
            sandbox/pu_index.py \
            sandbox/pu_network.py \
            sandbox/tests_analysis_routing.py \
            sandbox/tests_archive_safety.py \
            sandbox/tests_peg_schema.py \
            sandbox/tests_flutter_analysis.py \
            sandbox/tests_program_understanding.py \
            sandbox/tests_program_understanding_scopes.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < plugins/safe-android-reverser/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build static-core worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          load: true
          push: false
          tags: safe-android-reverser:ci
          build-args: |
            SAFE_REVERSER_VERSION=${{ steps.version.outputs.version }}
            SAFE_REVERSER_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=static-core
          cache-to: type=gha,mode=max,scope=static-core

      - name: Verify static-core ABI labels
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY'
          import json
          import subprocess
          import sys
          info = json.loads(subprocess.check_output(['docker', 'image', 'inspect', 'safe-android-reverser:ci']))[0]
          labels = info['Config']['Labels']
          assert labels['org.opencontainers.image.version'] == sys.argv[1], labels
          assert labels['io.safe-reverser.capability.id'] == 'static-core', labels
          assert labels['io.safe-reverser.capability.api'] == '1', labels
          assert labels['io.safe-reverser.worker.abi'] == '1', labels
          PY

      - name: Run routing integration test inside worker
        run: |
          mkdir -p "$RUNNER_TEMP/routing-data"
          docker run --rm \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
            --tmpfs=/work:rw,nosuid,nodev,size=1g \
            --user="$(id -u):$(id -g)" \
            --volume="$PWD:/workspace:ro" \
            --volume="$RUNNER_TEMP/routing-data:/data:rw" \
            --entrypoint=python3 \
            safe-android-reverser:ci \
            /workspace/sandbox/tests_analysis_routing.py

      - name: Run semantic integration tests inside worker
        run: |
          mkdir -p "$RUNNER_TEMP/semantic-data"
          for test in tests_archive_safety.py tests_flutter_analysis.py tests_program_understanding.py tests_program_understanding_scopes.py; do
            docker run --rm \
              --network=none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
              --tmpfs=/work:rw,nosuid,nodev,size=1g \
              --user="$(id -u):$(id -g)" \
              --volume="$PWD:/workspace:ro" \
              --volume="$RUNNER_TEMP/semantic-data:/data:rw" \
              --entrypoint=python3 \
              safe-android-reverser:ci \
              "/workspace/sandbox/$test"
          done

      - name: Run static worker MCP health smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-data"
          output="$RUNNER_TEMP/static-health.jsonl"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"health","arguments":{}}}' \
          | docker run --rm -i \
              --network=none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
              --tmpfs=/work:rw,nosuid,nodev,size=1g \
              --user="$(id -u):$(id -g)" \
              --env="SAFE_REVERSER_PLUGIN_VERSION=$VERSION" \
              --env="SAFE_REVERSER_IMAGE_REF=safe-android-reverser:ci" \
              --volume="$PWD:/workspace:ro" \
              --volume="$RUNNER_TEMP/mcp-data:/data:rw" \
              safe-android-reverser:ci > "$output"
          python3 - "$output" <<'PY'
          import json
          import sys
          rows = [json.loads(line) for line in open(sys.argv[1], encoding='utf-8') if line.strip()]
          response = next(item for item in rows if item.get('id') == 2)
          payload = json.loads(response['result']['content'][0]['text'])
          assert payload['capability_worker']['id'] == 'static-core', payload
          assert payload['capability_worker']['worker_abi'] == 1, payload
          assert payload['analysis_routing']['profiles']['framework-flutter']['status'] == 'declared', payload
          assert payload['tool_contract']['single_descriptor_source'] is True, payload
          PY

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/safe-v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing semver image
        if: startsWith(github.ref, 'refs/tags/safe-v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/safe-android-reverser:$VERSION"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::release image already exists and is immutable: $image"
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/safe-android-reverser
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=safe-v(.*),group=1

      - name: Publish tested static-core worker image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/safe-v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SAFE_REVERSER_VERSION=${{ steps.version.outputs.version }}
            SAFE_REVERSER_BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=static-core
