name: Build safe reverser sandbox

on:
  pull_request:
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/**'
      - '.github/workflows/build-safe-sandbox.yml'
  push:
    branches: [master]
    tags: ['safe-v*']
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/**'
      - '.github/workflows/build-safe-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test MCP server
        run: python3 sandbox/tests.py
      - name: Validate shell wrapper syntax
        run: bash -n plugins/safe-android-reverser/bin/safe-reverser-mcp
      - name: Validate JSON manifests
        run: |
          python3 -m json.tool plugins/safe-android-reverser/.claude-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/safe-android-reverser/.mcp.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/safe-android-reverser
          tags: |
            type=raw,value=0.1.0
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=safe-v(.*),group=1

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
