name: Build safe reverser sandbox

on:
  pull_request:
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/**'
      - '.github/workflows/build-safe-sandbox.yml'
  push:
    branches:
      - master
      - feat/safe-sandbox-plugin
      - feat/program-understanding-phase1
    tags: ['safe-v*']
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/**'
      - '.github/workflows/build-safe-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test MCP server
        run: python3 sandbox/tests.py
      - name: Test program understanding
        run: python3 sandbox/tests_program_understanding.py
      - name: Test extended MCP registration
        run: |
          export SAFE_REVERSER_WORKSPACE="$RUNNER_TEMP/safe-reverser-workspace"
          export SAFE_REVERSER_DATA_ROOT="$RUNNER_TEMP/safe-reverser-data"
          mkdir -p "$SAFE_REVERSER_WORKSPACE" "$SAFE_REVERSER_DATA_ROOT"
          PYTHONPATH=sandbox python3 - <<'PY'
          import mcp_server_v2 as server
          names = {tool["name"] for tool in server.core.TOOLS}
          expected = {
              "build_program_index",
              "find_symbols",
              "find_xrefs",
              "get_cfg",
              "identify_protector",
              "extract_network_model",
          }
          missing = expected - names
          assert not missing, f"missing semantic MCP tools: {sorted(missing)}"
          health = server.health({})
          assert health["version"] == "0.2.0"
          assert health["program_understanding"]["program_index"] is True
          PY
      - name: Test automatic runtime wrapper
        run: bash sandbox/test_wrapper.sh
      - name: Validate Python syntax
        run: |
          python3 -m py_compile sandbox/mcp_server.py sandbox/mcp_server_v2.py sandbox/program_understanding.py
      - name: Validate shell wrapper syntax
        run: bash -n plugins/safe-android-reverser/bin/safe-reverser-mcp
      - name: Validate JSON manifests
        run: |
          python3 -m json.tool plugins/safe-android-reverser/.claude-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/safe-android-reverser/.mcp.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/safe-v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/safe-android-reverser
          tags: |
            type=raw,value=0.2.0
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=safe-v(.*),group=1

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/safe-v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
