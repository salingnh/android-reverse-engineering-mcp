name: Build safe reverser sandbox

on:
  pull_request:
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/**'
      - '.github/workflows/build-safe-sandbox.yml'
  push:
    branches:
      - master
      - feat/safe-sandbox-plugin
      - feat/program-understanding-phase1
      - feat/trace-call-path
    tags: ['safe-v*']
    paths:
      - 'sandbox/**'
      - 'plugins/safe-android-reverser/**'
      - '.github/workflows/build-safe-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test MCP server
        run: python3 sandbox/tests.py
      - name: Test program understanding
        run: python3 sandbox/tests_program_understanding.py
      - name: Test program understanding source scopes and cache integrity
        run: PYTHONPATH=sandbox python3 sandbox/tests_program_understanding_scopes.py
      - name: Test trace_call_path
        run: PYTHONPATH=sandbox python3 sandbox/tests_trace_call_path.py
      - name: Test extended MCP registration
        run: |
          export SAFE_REVERSER_WORKSPACE="$RUNNER_TEMP/safe-reverser-workspace"
          export SAFE_REVERSER_DATA_ROOT="$RUNNER_TEMP/safe-reverser-data"
          mkdir -p "$SAFE_REVERSER_WORKSPACE" "$SAFE_REVERSER_DATA_ROOT"
          PYTHONPATH=sandbox python3 - <<'PY'
          import mcp_server_v2 as server
          names = {tool["name"] for tool in server.core.TOOLS}
          expected = {
              "build_program_index",
              "find_symbols",
              "find_xrefs",
              "trace_call_path",
              "get_cfg",
              "identify_protector",
              "extract_network_model",
          }
          missing = expected - names
          assert not missing, f"missing semantic MCP tools: {sorted(missing)}"
          health = server.health({})
          assert health["version"] == "0.2.1"
          assert health["program_understanding"]["program_index"] is True
          assert health["program_understanding"]["index_storage"] == "sqlite"
          assert health["program_understanding"]["call_path"] is True
          PY
      - name: Test automatic runtime wrapper
        run: bash sandbox/test_wrapper.sh
      - name: Validate Python syntax
        run: |
          python3 -m py_compile sandbox/mcp_server.py sandbox/mcp_server_v2.py sandbox/program_understanding.py sandbox/program_understanding_v2.py sandbox/pu_source.py sandbox/pu_index.py sandbox/pu_call_path.py sandbox/pu_network.py sandbox/tests_program_understanding.py sandbox/tests_program_understanding_scopes.py sandbox/tests_trace_call_path.py
      - name: Validate shell wrapper syntax
        run: bash -n plugins/safe-android-reverser/bin/safe-reverser-mcp
      - name: Validate JSON manifests
        run: |
          python3 -m json.tool plugins/safe-android-reverser/.claude-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/safe-android-reverser/.mcp.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image for integration tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          load: true
          push: false
          tags: safe-android-reverser:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run real DEX semantic integration test inside image
        run: |
          mkdir -p "$RUNNER_TEMP/safe-reverser-runtime-data"
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
            --tmpfs=/work:rw,nosuid,nodev,size=1g \
            --user="$(id -u):$(id -g)" \
            --volume="$PWD:/workspace:ro" \
            --volume="$RUNNER_TEMP/safe-reverser-runtime-data:/data:rw" \
            --entrypoint=python3 \
            safe-android-reverser:ci \
            /workspace/sandbox/tests_program_understanding.py

      - name: Run source-scope/cache regression test inside image
        run: |
          mkdir -p "$RUNNER_TEMP/safe-reverser-scope-data"
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
            --tmpfs=/work:rw,nosuid,nodev,size=1g \
            --user="$(id -u):$(id -g)" \
            --volume="$PWD:/workspace:ro" \
            --volume="$RUNNER_TEMP/safe-reverser-scope-data:/data:rw" \
            --entrypoint=python3 \
            safe-android-reverser:ci \
            /workspace/sandbox/tests_program_understanding_scopes.py

      - name: Run call-path regression and stress test inside image
        run: |
          mkdir -p "$RUNNER_TEMP/safe-reverser-call-path-data"
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
            --tmpfs=/work:rw,nosuid,nodev,size=1g \
            --user="$(id -u):$(id -g)" \
            --volume="$PWD:/workspace:ro" \
            --volume="$RUNNER_TEMP/safe-reverser-call-path-data:/data:rw" \
            --entrypoint=python3 \
            safe-android-reverser:ci \
            /workspace/sandbox/tests_trace_call_path.py

      - name: Run MCP health smoke test inside image
        run: |
          mkdir -p "$RUNNER_TEMP/safe-reverser-mcp-data"
          output="$RUNNER_TEMP/safe-reverser-health.jsonl"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"health","arguments":{}}}' \
          | docker run --rm -i \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --tmpfs=/tmp:rw,nosuid,nodev,size=1g \
              --tmpfs=/work:rw,nosuid,nodev,size=1g \
              --user="$(id -u):$(id -g)" \
              --volume="$PWD:/workspace:ro" \
              --volume="$RUNNER_TEMP/safe-reverser-mcp-data:/data:rw" \
              safe-android-reverser:ci > "$output"
          python3 - "$output" <<'PY'
          import json
          import sys
          responses = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          health_response = next(item for item in responses if item.get("id") == 2)
          payload = json.loads(health_response["result"]["content"][0]["text"])
          assert payload["version"] == "0.2.1", payload
          assert payload["tools"]["androguard"] is True, payload
          assert payload["program_understanding"]["cfg"] is True, payload
          assert payload["program_understanding"]["call_path"] is True, payload
          assert payload["program_understanding"]["index_storage"] == "sqlite", payload
          PY

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/safe-v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/safe-android-reverser
          tags: |
            type=raw,value=0.2.1
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=safe-v(.*),group=1

      - name: Publish tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/safe-v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
