name: Manual release Safe Android Reverser

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from plugins/safe-android-reverser/VERSION, for example 0.3.0
        required: true
        type: string
      release_ref:
        description: Exact release branch/ref to publish, for example release/safe-v0.3.0
        required: true
        type: string
      expected_sha:
        description: Exact 40-character commit SHA that already passed release CI
        required: true
        type: string

concurrency:
  group: safe-android-reverser-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  packages: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Validate, tag, publish and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Validate release identity
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < plugins/safe-android-reverser/VERSION)"
          release_sha="$(git rev-parse HEAD)"
          expected_sha="$(printf '%s' "$INPUT_EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          tag="safe-v${version}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$INPUT_VERSION" == "$version" ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$release_sha" == "$expected_sha" ]]

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tag_sha="$(git rev-list -n 1 "$tag")"
            [[ "$tag_sha" == "$release_sha" ]] || {
              echo "::error::tag $tag already exists at $tag_sha, expected $release_sha"
              exit 1
            }
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-run release consistency gate
        run: python3 scripts/check_release_consistency.py

      - name: Require successful exact-head release CI
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_REPOSITORY" "$RELEASE_SHA" <<'PY'
          import json
          import subprocess
          import sys

          repo, sha = sys.argv[1:3]
          required = {
              "Build static-core capability",
              "Build framework-flutter capability",
              "Test Safe Reverser control plane",
              "Test Flutter runtime-cache build",
          }
          payload = json.loads(subprocess.check_output([
              "gh", "api",
              f"repos/{repo}/actions/runs?head_sha={sha}&per_page=100",
          ], text=True))
          successful = {
              run["name"]
              for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == sha and run.get("conclusion") == "success"
          }
          missing = sorted(required - successful)
          if missing:
              raise SystemExit(
                  "exact-head release CI is incomplete; missing successful workflows: "
                  + ", ".join(missing)
              )
          print("exact-head release CI OK:", ", ".join(sorted(required)))
          PY

      - name: Log in to GHCR for verification
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check existing semver images
        id: images
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          verify_existing() {
            local image="$1"
            local capability="$2"
            local output_name="$3"
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              docker pull "$image" >/dev/null
              python3 - "$image" "$capability" "$VERSION" "$RELEASE_SHA" <<'PY'
          import json
          import subprocess
          import sys

          image, capability, version, revision = sys.argv[1:5]
          info = json.loads(subprocess.check_output(["docker", "image", "inspect", image]))[0]
          labels = info["Config"]["Labels"] or {}
          expected = {
              "org.opencontainers.image.version": version,
              "org.opencontainers.image.revision": revision,
              "io.safe-reverser.capability.id": capability,
              "io.safe-reverser.capability.api": "1",
              "io.safe-reverser.worker.abi": "1",
          }
          for key, value in expected.items():
              if labels.get(key) != value:
                  raise SystemExit(
                      f"existing image provenance mismatch: {image} {key}="
                      f"{labels.get(key)!r}, expected {value!r}"
                  )
          PY
              echo "$output_name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$output_name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          verify_existing \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/safe-android-reverser:${VERSION}" \
            "static-core" \
            "static_exists"
          verify_existing \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/safe-android-reverser-flutter:${VERSION}" \
            "framework-flutter" \
            "flutter_exists"

      - name: Create annotated release tag
        if: steps.release.outputs.tag_exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$RELEASE_SHA" -m "Safe Android Reverser $VERSION"
          git push origin "refs/tags/$TAG"

      - name: Publish missing capability images
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          STATIC_EXISTS: ${{ steps.images.outputs.static_exists }}
          FLUTTER_EXISTS: ${{ steps.images.outputs.flutter_exists }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            local label="$2"

            mapfile -t before_ids < <(
              gh run list \
                --workflow "$workflow" \
                --event workflow_dispatch \
                --commit "$RELEASE_SHA" \
                --limit 20 \
                --json databaseId \
                --jq '.[].databaseId' 2>/dev/null || true
            )

            gh workflow run "$workflow" --ref "$TAG"

            local run_id=""
            for _ in $(seq 1 60); do
              mapfile -t current_ids < <(
                gh run list \
                  --workflow "$workflow" \
                  --event workflow_dispatch \
                  --commit "$RELEASE_SHA" \
                  --limit 20 \
                  --json databaseId \
                  --jq '.[].databaseId' 2>/dev/null || true
              )
              for candidate in "${current_ids[@]:-}"; do
                local seen=false
                for old in "${before_ids[@]:-}"; do
                  if [[ "$candidate" == "$old" ]]; then
                    seen=true
                    break
                  fi
                done
                if [[ "$seen" == false && -n "$candidate" ]]; then
                  run_id="$candidate"
                  break 2
                fi
              done
              sleep 2
            done

            [[ -n "$run_id" ]] || {
              echo "::error::could not resolve dispatched run for $label"
              exit 1
            }

            echo "Waiting for $label workflow run $run_id"
            gh run watch "$run_id" --exit-status
          }

          if [[ "$STATIC_EXISTS" != "true" ]]; then
            dispatch_and_wait "build-safe-sandbox.yml" "static-core"
          fi
          if [[ "$FLUTTER_EXISTS" != "true" ]]; then
            dispatch_and_wait "build-flutter-profile.yml" "framework-flutter"
          fi

      - name: Verify published images and immutable digests
        id: verify
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          verify_image() {
            local image="$1"
            local capability="$2"
            docker pull "$image" >/dev/null
            python3 - "$image" "$capability" "$VERSION" "$RELEASE_SHA" <<'PY'
          import json
          import subprocess
          import sys

          image, capability, version, revision = sys.argv[1:5]
          info = json.loads(subprocess.check_output(["docker", "image", "inspect", image]))[0]
          labels = info["Config"]["Labels"] or {}
          expected = {
              "org.opencontainers.image.version": version,
              "org.opencontainers.image.revision": revision,
              "io.safe-reverser.capability.id": capability,
              "io.safe-reverser.capability.api": "1",
              "io.safe-reverser.worker.abi": "1",
          }
          for key, value in expected.items():
              assert labels.get(key) == value, (key, labels.get(key), value)
          repo_digests = info.get("RepoDigests") or []
          if not repo_digests:
              raise SystemExit(f"published image has no immutable RepoDigest: {image}")
          print(repo_digests[0])
          PY
          }

          static_digest="$(
            verify_image \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/safe-android-reverser:${VERSION}" \
              "static-core" | tail -n1
          )"
          flutter_digest="$(
            verify_image \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/safe-android-reverser-flutter:${VERSION}" \
              "framework-flutter" | tail -n1
          )"

          echo "static_digest=$static_digest" >> "$GITHUB_OUTPUT"
          echo "flutter_digest=$flutter_digest" >> "$GITHUB_OUTPUT"

      - name: Build plugin release package
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          (
            cd plugins
            zip -qr "../dist/safe-android-reverser-${VERSION}.zip" safe-android-reverser
          )
          (
            cd dist
            sha256sum "safe-android-reverser-${VERSION}.zip" > SHA256SUMS
          )

      - name: Create or update GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/safe-android-reverser-${VERSION}.zip" \
              "dist/SHA256SUMS" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/safe-android-reverser-${VERSION}.zip" \
              "dist/SHA256SUMS" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "Safe Android Reverser ${VERSION}" \
              --generate-notes
          fi

      - name: Release summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          STATIC_DIGEST: ${{ steps.verify.outputs.static_digest }}
          FLUTTER_DIGEST: ${{ steps.verify.outputs.flutter_digest }}
        run: |
          {
            echo "## Safe Android Reverser ${VERSION}"
            echo
            echo "- Tag: \`${TAG}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- static-core: \`${STATIC_DIGEST}\`"
            echo "- framework-flutter: \`${FLUTTER_DIGEST}\`"
            echo "- GitHub Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
